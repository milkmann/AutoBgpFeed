services:
  bgp-core:
    build: ./bgp-core
    container_name: bgp-core
    restart: unless-stopped
    networks:
      routefeed-net:
        ipv4_address: 172.30.0.2
    ports:
      - "${BGP_PORT:-179}:179"
    volumes:
      - ./bgp-core/generated:/etc/bird/generated
      - bird-run:/run/bird
    environment:
      - SERVER_IP=${SERVER_IP:-172.30.0.2}
      - SERVER_ASN=${SERVER_ASN:-65000}
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
    healthcheck:
      test: ["CMD", "birdc", "-s", "/run/bird/bird.ctl", "show", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  source-manager:
    build: ./source-manager
    container_name: source-manager
    restart: unless-stopped
    networks:
      routefeed-net:
        ipv4_address: 172.30.0.4
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./bgp-core/generated:/generated
      - bird-run:/run/bird
    environment:
      - DATA_DIR=/data
      - GENERATED_DIR=/generated
      - BIRD_SOCKET=/run/bird/bird.ctl
      - SERVER_IP=${SERVER_IP:-127.0.0.1}
      - SERVER_ASN=${SERVER_ASN:-65000}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - MIN_PREFIX_LENGTH=${MIN_PREFIX_LENGTH:-8}
      - CACHE_MAX_AGE=${CACHE_MAX_AGE:-604800}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-1}
    depends_on:
      bgp-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bird-run:

networks:
  routefeed-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
